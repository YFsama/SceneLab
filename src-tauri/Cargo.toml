[package]
name = "scenelab"
version = "0.30.0"
edition = "2021"

[lib]
name = "scenelab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Runtime DLL loading for the SMLib exact-geometry service (see src/sm/).
libloading = "0.8"
